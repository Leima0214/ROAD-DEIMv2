task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

# DEIMv2 custom datasets pass category_id directly to the criterion, so the
# companion preparation script creates a non-destructive 0..3 annotation view.
num_classes: 4
remap_mscoco_category: False

train_dataloader:
  dataset:
    img_folder: /JAPAN4-DETR/JAPAN4-DETR/images/train
    ann_file: /JAPAN4-DETR/JAPAN4-DETR/annotations/deimv2/instances_train.json
  num_workers: 8

val_dataloader:
  dataset:
    img_folder: /JAPAN4-DETR/JAPAN4-DETR/images/val
    ann_file: /JAPAN4-DETR/JAPAN4-DETR/annotations/deimv2/instances_val.json
  num_workers: 8
