__include__: [
  'deimv2_hgnetv2_n_japan4.yml'
]

# M3-A is a matched 32-epoch causal screen, not a formal 160E result.
# It changes only M2's wide asymmetric log-bias into a symmetric bounded residual.
# Matcher, losses, GO union, query count, encoder, cross-attention and FFN stay B0.
epoches: 32
output_dir: ./outputs/deimv2_hgnetv2_n_japan4_m3a_bounded_ease_l2_32e

DEIMTransformer:
  use_ease_l2: True
  ease_log_bias_cap: 0.25
